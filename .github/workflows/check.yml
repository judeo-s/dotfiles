name: Check dotfiles
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4 zsh neovim
      - run: bash install.sh --dry-run --graphics native
      - run: python scripts/check.py
      - run: python -m unittest discover -s tests -v
